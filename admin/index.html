<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesFullZ — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #04040a; --surface: #0a0b16; --card: #0d0f1e;
            --cyan: #00e5ff; --purple: #8a2be2; --blue: #0044ff;
            --text: #fff; --muted: #9ba1c9;
            --border: rgba(138, 80, 255, 0.15);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        
        .login-container {
            width: 420px; background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 50px 40px; position: relative; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(138,43,226,0.15);
        }
        .login-container::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background: linear-gradient(90deg, var(--cyan), var(--purple), var(--blue));
        }
        .login-logo {
            font-family:'Rajdhani',sans-serif; font-size:2.5rem; text-align:center; 
            margin-bottom:10px; font-weight:700; letter-spacing:1px;
        }
        .login-logo span { 
            background:linear-gradient(90deg,var(--cyan),var(--purple));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .login-sub { text-align:center; color:var(--muted); margin-bottom:40px; font-size:0.9rem; }
        
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:1rem; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
        .form-group input {
            width:100%; background:#000; border:1px solid var(--border); color:white;
            padding:14px 20px; border-radius:6px; font-family:'Montserrat',sans-serif;
            font-size:1rem; outline:none; transition:all 0.3s;
        }
        .form-group input:focus { border-color:var(--cyan); box-shadow:0 0 15px rgba(0,229,255,0.2); }
        
        .login-btn {
            width:100%; padding:16px; border:none; border-radius:6px; cursor:pointer;
            background:linear-gradient(45deg, var(--blue), var(--purple));
            color:white; font-family:'Rajdhani',sans-serif; font-size:1.3rem;
            font-weight:700; text-transform:uppercase; letter-spacing:2px;
            transition:all 0.4s; position:relative; overflow:hidden;
        }
        .login-btn::before {
            content:''; position:absolute; top:0; left:-100%; width:50%; height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform:skewX(-20deg); transition:left 0.5s;
        }
        .login-btn:hover::before { left:150%; }
        .login-btn:hover { box-shadow:0 0 30px rgba(138,43,226,0.4); transform:translateY(-2px); }
        
        .error-msg { color:#ff4444; text-align:center; margin-top:15px; font-size:0.9rem; min-height:20px; }
        .pulse-icon { text-align:center; margin-bottom:30px; font-size:3rem; color:var(--purple); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="pulse-icon"><i class="fas fa-shield-alt"></i></div>
        <div class="login-logo">GAMESFULL<span>Z</span></div>
        <p class="login-sub">Admin Control Panel</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="admin" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-lock-open"></i> ACCESS</button>
        </form>
        <p class="error-msg" id="errorMsg"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('errorMsg');
            errEl.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('gfz_token', data.token);
                    window.location.href = '/admin/dashboard.html';
                } else {
                    errEl.textContent = data.error || 'Error de autenticación.';
                }
            } catch (err) {
                errEl.textContent = 'Error de conexión con el servidor.';
            }
        });

        // If already logged in, redirect
        (async () => {
            try {
                const res = await fetch('/api/auth/verify', { credentials: 'include' });
                const data = await res.json();
                if (data.valid) window.location.href = '/admin/dashboard.html';
            } catch {}
        })();
    </script>
</body>
</html>
